version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: eventflow_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eventflow_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventflow_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventflow_api
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/eventflow_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secure-jwt-production-secret-min-32-chars
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: super-secure-refresh-jwt-production-secret-min-32-chars
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: '*'
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
      BOOKING_RATE_LIMIT_MAX: 10
      AUTH_RATE_LIMIT_MAX: 15
      MAX_TICKETS_PER_BOOKING: 5
      CANCELLATION_DEADLINE_HOURS: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
